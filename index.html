<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>品酒笔记</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #fff;
            min-height: 100vh;
            padding-bottom: 80px;
        }
        .container { max-width: 480px; margin: 0 auto; padding: 20px; }
        
        /* 登录页面 */
        .auth-page {
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 100vh;
            padding: 40px 20px;
        }
        .logo { text-align: center; margin-bottom: 40px; }
        .logo h1 {
            font-size: 2.5rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .logo p { color: #888; margin-top: 10px; }
        
        .form-group { margin-bottom: 20px; }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #aaa;
            font-size: 0.9rem;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 15px;
            border: 1px solid #333;
            border-radius: 12px;
            background: #252540;
            color: #fff;
            font-size: 1rem;
        }
        .form-group input:focus, .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
        }
        .btn-secondary {
            background: transparent;
            color: #667eea;
            border: 1px solid #667eea;
            margin-top: 10px;
        }
        .link {
            text-align: center;
            margin-top: 20px;
            color: #667eea;
            cursor: pointer;
        }
        
        /* 导航栏 */
        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #252540;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            border-top: 1px solid #333;
            z-index: 1000;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #888;
            cursor: pointer;
            padding: 5px 20px;
        }
        .nav-item.active { color: #667eea; }
        .nav-item span { font-size: 0.75rem; margin-top: 4px; }
        
        /* 页面 */
        .page { display: none; }
        .page.active { display: block; }
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-top: 10px;
        }
        .page-header h2 { font-size: 1.5rem; }
        
        /* 添加按钮 */
        .fab {
            position: fixed;
            bottom: 90px;
            right: 20px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: #fff;
            font-size: 2rem;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            z-index: 999;
        }
        
        /* 酒款卡片 */
        .wine-card {
            background: #252540;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
            cursor: pointer;
        }
        .wine-card-header { display: flex; gap: 12px; }
        .wine-image {
            width: 80px;
            height: 100px;
            border-radius: 8px;
            object-fit: cover;
            background: #333;
        }
        .wine-info { flex: 1; }
        .wine-name { font-size: 1.1rem; font-weight: 600; margin-bottom: 4px; }
        .wine-meta { color: #888; font-size: 0.85rem; line-height: 1.5; }
        .wine-score {
            display: flex;
            gap: 15px;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #333;
        }
        .score-item { display: flex; align-items: center; gap: 6px; font-size: 0.9rem; }
        .score-value {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
            font-size: 1.1rem;
        }
        
        /* 表单 */
        .photo-upload {
            width: 100%;
            height: 200px;
            border: 2px dashed #667eea;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            margin-bottom: 20px;
            background: #252540;
        }
        .photo-upload.has-image { border: none; padding: 0; }
        .photo-upload img { width: 100%; height: 100%; object-fit: cover; border-radius: 16px; }
        
        .rating-group { margin-bottom: 20px; }
        .rating-group label { display: block; margin-bottom: 10px; color: #aaa; }
        .rating-stars { display: flex; gap: 10px; font-size: 2rem; }
        .star { cursor: pointer; color: #333; transition: color 0.2s; }
        .star.active { color: #ffd700; }
        textarea { min-height: 100px; resize: vertical; font-family: inherit; }
        
        /* 统计 */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: #252540;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
        }
        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .stat-label { color: #888; font-size: 0.9rem; margin-top: 8px; }
        
        .chart-container {
            background: #252540;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
        }
        .chart-title { font-size: 1rem; margin-bottom: 16px; color: #aaa; }
        .bar-chart { display: flex; flex-direction: column; gap: 12px; }
        .bar-item { display: flex; align-items: center; gap: 10px; }
        .bar-label { width: 100px; font-size: 0.85rem; color: #888; }
        .bar-track { flex: 1; height: 24px; background: #333; border-radius: 12px; overflow: hidden; }
        .bar-fill { height: 100%; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border-radius: 12px; }
        .bar-value { width: 40px; text-align: right; font-size: 0.85rem; color: #888; }
        
        /* 个人资料 */
        .profile-header { text-align: center; padding: 30px 0; }
        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            margin: 0 auto 16px;
        }
        .menu-list { background: #252540; border-radius: 16px; overflow: hidden; }
        .menu-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            border-bottom: 1px solid #333;
            cursor: pointer;
        }
        .menu-item:last-child { border-bottom: none; }
        .menu-item-left { display: flex; align-items: center; gap: 12px; }
        .menu-item-icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: #333;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <!-- 登录页面 -->
    <div id="loginPage" class="auth-page">
        <div class="logo">
            <h1>🍷 品酒笔记</h1>
            <p>记录每一杯精彩</p>
        </div>
        <form id="loginForm">
            <div class="form-group">
                <label>手机号</label>
                <input type="tel" id="loginPhone" placeholder="请输入手机号" required>
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" id="loginPassword" placeholder="请输入密码" required>
            </div>
            <button type="submit" class="btn btn-primary">登录</button>
        </form>
        <div class="link" onclick="showPage('registerPage')">还没有账号？立即注册</div>
        <div class="link" onclick="showPage('forgotPage')" style="margin-top: 10px; font-size: 0.9rem;">忘记密码？</div>
    </div>
    
    <!-- 注册页面 -->
    <div id="registerPage" class="auth-page hidden">
        <div class="logo"><h1>注册账号</h1></div>
        <form id="registerForm">
            <div class="form-group">
                <label>手机号</label>
                <input type="tel" id="regPhone" placeholder="请输入手机号" required>
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" id="regPassword" placeholder="请设置密码（至少6位）" required>
            </div>
            <div class="form-group">
                <label>确认密码</label>
                <input type="password" id="regPasswordConfirm" placeholder="请再次输入密码" required>
            </div>
            <button type="submit" class="btn btn-primary">注册</button>
            <button type="button" class="btn btn-secondary" onclick="showPage('loginPage')">返回登录</button>
        </form>
    </div>
    
    <!-- 忘记密码页面 -->
    <div id="forgotPage" class="auth-page hidden">
        <div class="logo"><h1>重置密码</h1></div>
        <form id="forgotForm">
            <div class="form-group">
                <label>手机号</label>
                <input type="tel" id="forgotPhone" placeholder="请输入注册手机号" required>
            </div>
            <div class="form-group">
                <label>短信验证码</label>
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="verifyCode" placeholder="请输入验证码" style="flex: 1;" required>
                    <button type="button" class="btn btn-secondary" style="width: 120px; margin: 0;" onclick="sendVerifyCode()">获取验证码</button>
                </div>
            </div>
            <div class="form-group">
                <label>新密码</label>
                <input type="password" id="newPassword" placeholder="请设置新密码" required>
            </div>
            <button type="submit" class="btn btn-primary">重置密码</button>
            <button type="button" class="btn btn-secondary" onclick="showPage('loginPage')">返回登录</button>
        </form>
    </div>
    
    <!-- 主应用 -->
    <div id="mainApp" class="hidden">
        <!-- 首页 -->
        <div id="homePage" class="page active">
            <div class="container">
                <div class="page-header"><h2>我的酒款</h2></div>
                <div id="wineList"></div>
            </div>
            <button class="fab" onclick="showPage('addPage')">+</button>
        </div>
        
        <!-- 统计页面 -->
        <div id="statsPage" class="page">
            <div class="container">
                <div class="page-header"><h2>品酒分析</h2></div>
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-value" id="totalWines">0</div>
                        <div class="stat-label">品鉴酒款</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="avgScore">0</div>
                        <div class="stat-label">平均评分</div>
                    </div>
                </div>
                <div class="chart-container">
                    <div class="chart-title">产区偏好</div>
                    <div class="bar-chart" id="regionChart"></div>
                </div>
                <div class="chart-container">
                    <div class="chart-title">葡萄品种偏好</div>
                    <div class="bar-chart" id="grapeChart"></div>
                </div>
            </div>
        </div>
        
        <!-- 个人资料页面 -->
        <div id="profilePage" class="page">
            <div class="container">
                <div class="profile-header">
                    <div class="avatar">👤</div>
                    <div class="profile-name" id="userName">品酒师</div>
                    <div class="profile-phone" id="userPhone">--</div>
                </div>
                <div class="menu-list">
                    <div class="menu-item" onclick="showPage('statsPage')">
                        <div class="menu-item-left"><div class="menu-item-icon">📊</div><span>品酒分析</span></div>
                        <span>›</span>
                    </div>
                    <div class="menu-item" onclick="exportData()">
                        <div class="menu-item-left"><div class="menu-item-icon">📥</div><span>导出数据</span></div>
                        <span>›</span>
                    </div>
                    <div class="menu-item" onclick="logout()">
                        <div class="menu-item-left"><div class="menu-item-icon">🚪</div><span>退出登录</span></div>
                        <span>›</span>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 添加酒款页面 -->
        <div id="addPage" class="page">
            <div class="container">
                <div class="page-header"><h2>记录新酒款</h2></div>
                <form id="wineForm">
                    <div class="photo-upload" id="photoUpload" onclick="document.getElementById('winePhoto').click()">
                        <span style="font-size: 3rem;">📷</span>
                        <span style="color: #667eea; margin-top: 10px;">点击拍照或上传</span>
                    </div>
                    <input type="file" id="winePhoto" accept="image/*" capture="environment" style="display: none;" onchange="handlePhotoUpload(event)">
                    
                    <div class="form-group">
                        <label>酒款名称 *</label>
                        <input type="text" id="wineName" placeholder="例如：Chateau Margaux" required>
                    </div>
                    <div class="form-group">
                        <label>年份</label>
                        <input type="number" id="wineYear" placeholder="例如：2015" min="1800" max="2099">
                    </div>
                    <div class="form-group">
                        <label>酒庄</label>
                        <input type="text" id="wineChateau" placeholder="例如：玛歌酒庄">
                    </div>
                    <div class="form-group">
                        <label>产区</label>
                        <input type="text" id="wineRegion" placeholder="例如：波尔多 Margaux">
                    </div>
                    <div class="form-group">
                        <label>葡萄品种</label>
                        <input type="text" id="wineGrape" placeholder="例如：赤霞珠、梅洛">
                    </div>
                    <div class="rating-group">
                        <label>香气评分</label>
                        <div class="rating-stars" id="aromaRating">
                            <span class="star" data-value="1">★</span>
                            <span class="star" data-value="2">★</span>
                            <span class="star" data-value="3">★</span>
                            <span class="star" data-value="4">★</span>
                            <span class="star" data-value="5">★</span>
                        </div>
                    </div>
                    <div class="rating-group">
                        <label>口感评分</label>
                        <div class="rating-stars" id="tasteRating">
                            <span class="star" data-value="1">★</span>
                            <span class="star" data-value="2">★</span>
                            <span class="star" data-value="3">★</span>
                            <span class="star" data-value="4">★</span>
                            <span class="star" data-value="5">★</span>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>品酒笔记</label>
                        <textarea id="wineNotes" placeholder="记录你的品酒感受..."></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">保存记录</button>
                    <button type="button" class="btn btn-secondary" onclick="showPage('homePage')">取消</button>
                </form>
            </div>
        </div>
        
        <!-- 底部导航 -->
        <div class="nav-bar">
            <div class="nav-item active" onclick="showTab('home')">
                <span>🏠</span><span>首页</span>
            </div>
            <div class="nav-item" onclick="showTab('stats')">
                <span>📊</span><span>分析</span>
            </div>
            <div class="nav-item" onclick="showTab('profile')">
                <span>👤</span><span>我的</span>
            </div>
        </div>
    </div>
    
    <script>
        // 数据存储
        let currentUser = null;
        let wines = JSON.parse(localStorage.getItem('wines') || '[]');
        let ratings = { aroma: 0, taste: 0 };
        
        // 页面切换
        function showPage(pageId) {
            document.querySelectorAll('.auth-page, .page').forEach(p => p.classList.add('hidden'));
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            const page = document.getElementById(pageId);
            if (page) {
                page.classList.remove('hidden');
                if (page.classList.contains('page')) page.classList.add('active');
            }
            if (pageId === 'statsPage') updateStats();
        }
        
        function showTab(tab) {
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            event.target.closest('.nav-item').classList.add('active');
            if (tab === 'home') showPage('homePage');
            else if (tab === 'stats') showPage('statsPage');
            else if (tab === 'profile') showPage('profilePage');
        }
        
        // 登录
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const phone = document.getElementById('loginPhone').value;
            const password = document.getElementById('loginPassword').value;
            const users = JSON.parse(localStorage.getItem('users') || '{}');
            if (users[phone] && users[phone].password === password) {
                currentUser = { phone, name: users[phone].name || '品酒师' };
                localStorage.setItem('currentUser', JSON.stringify(currentUser));
                loginSuccess();
            } else {
                alert('手机号或密码错误');
            }
        });
        
        // 注册
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const phone = document.getElementById('regPhone').value;
            const password = document.getElementById('regPassword').value;
            const confirm = document.getElementById('regPasswordConfirm').value;
            if (password !== confirm) { alert('两次密码不一致'); return; }
            if (password.length < 6) { alert('密码至少6位'); return; }
            const users = JSON.parse(localStorage.getItem('users') || '{}');
            if (users[phone]) { alert('该手机号已注册'); return; }
            users[phone] = { password, name: '品酒师' };
            localStorage.setItem('users', JSON.stringify(users));
            alert('注册成功！');
            showPage('loginPage');
        });
        
        // 发送验证码
        function sendVerifyCode() {
            const phone = document.getElementById('forgotPhone').value;
            if (!phone) { alert('请输入手机号'); return; }
            alert('验证码已发送：123456（演示用）');
        }
        
        // 重置密码
        document.getElementById('forgotForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const phone = document.getElementById('forgotPhone').value;
            const code = document.getElementById('verifyCode').value;
            const newPass = document.getElementById('newPassword').value;
            if (code !== '123456') { alert('验证码错误'); return; }
            const users = JSON.parse(localStorage.getItem('users') || '{}');
            if (!users[phone]) { alert('该手机号未注册'); return; }
            users[phone].password = newPass;
            localStorage.setItem('users', JSON.stringify(users));
            alert('密码重置成功！');
            showPage('loginPage');
        });
        
        // 登录成功
        function loginSuccess() {
            document.getElementById('loginPage').classList.add('hidden');
            document.getElementById('mainApp').classList.remove('hidden');
            document.getElementById('userPhone').textContent = currentUser.phone;
            loadWines();
        }
        
        // 退出登录
        function logout() {
            currentUser = null;
            localStorage.removeItem('currentUser');
            document.getElementById('mainApp').classList.add('hidden');
            showPage('loginPage');
        }
        
        // 照片上传
        function handlePhotoUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const upload = document.getElementById('photoUpload');
                    upload.innerHTML = `<img src="${e.target.result}" alt="酒款照片">`;
                    upload.classList.add('has-image');
                    upload.dataset.image = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        }
        
        // 评分
        document.querySelectorAll('.rating-stars').forEach(container => {
            const stars = container.querySelectorAll('.star');
            const type = container.id === 'aromaRating' ? 'aroma' : 'taste';
            stars.forEach((star, index) => {
                star.addEventListener('click', () => {
                    ratings[type] = index + 1;
                    stars.forEach((s, i) => s.classList.toggle('active', i <= index));
                });
            });
        });
        
        // 保存酒款
        document.getElementById('wineForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const wine = {
                id: Date.now(),
                name: document.getElementById('wineName').value,
                year: document.getElementById('wineYear').value,
                chateau: document.getElementById('wineChateau').value,
                region: document.getElementById('wineRegion').value,
                grape: document.getElementById('wineGrape').value,
                aroma: ratings.aroma,
                taste: ratings.taste,
                notes: document.getElementById('wineNotes').value,
                image: document.getElementById('photoUpload').dataset.image || '',
                date: new Date().toISOString()
            };
            wines.unshift(wine);
            localStorage.setItem('wines', JSON.stringify(wines));
            this.reset();
            document.getElementById('photoUpload').innerHTML = '<span style="font-size: 3rem;">📷</span><span style="color: #667eea; margin-top: 10px;">点击拍照或上传</span>';
            document.getElementById('photoUpload').classList.remove('has-image');
            document.querySelectorAll('.star').forEach(s => s.classList.remove('active'));
            ratings = { aroma: 0, taste: 0 };
            alert('保存成功！');
            showPage('homePage');
            loadWines();
        });
        
        // 加载酒款列表
        function loadWines() {
            const list = document.getElementById('wineList');
            if (wines.length === 0) {
                list.innerHTML = '<p style="text-align: center; color: #888; padding: 40px;">还没有记录，点击右下角 + 开始记录你的第一杯酒</p>';
                return;
            }
            list.innerHTML = wines.map(wine => `
                <div class="wine-card" onclick="viewWine(${wine.id})">
                    <div class="wine-card-header">
                        ${wine.image ? `<img src="${wine.image}" class="wine-image" alt="">` : '<div class="wine-image" style="display: flex; align-items: center; justify-content: center; background: #333;">🍷</div>'}
                        <div class="wine-info">
                            <div class="wine-name">${wine.name}</div>
                            <div class="wine-meta">${wine.year ? wine.year + '年 · ' : ''}${wine.chateau || '未知酒庄'}<br>${wine.region || ''}</div>
                        </div>
                    </div>
                    <div class="wine-score">
                        <div class="score-item"><span>香气</span><span class="score-value">${wine.aroma || '-'}</span></div>
                        <div class="score-item"><span>口感</span><span class="score-value">${wine.taste || '-'}</span></div>
                    </div>
                </div>
            `).join('');
        }
        
        // 查看酒款详情
        function viewWine(id) {
            const wine = wines.find(w => w.id === id);
            if (wine) {
                alert(`酒款：${wine.name}\n年份：${wine.year || '未标注'}\n酒庄：${wine.chateau || '未标注'}\n产区：${wine.region || '未标注'}\n葡萄：${wine.grape || '未标注'}\n香气：${wine.aroma || '未评分'} 分\n口感：${wine.taste || '未评分'} 分\n\n品酒笔记：\n${wine.notes || '无'}`);
            }
        }
        
        // 更新统计
        function updateStats() {
            document.getElementById('totalWines').textContent = wines.length;
            if (wines.length === 0) {
                document.getElementById('avgScore').textContent = '0';
                document.getElementById('regionChart').innerHTML = '<p style="color: #888; text-align: center;">暂无数据</p>';
                document.getElementById('grapeChart').innerHTML = '<p style="color: #888; text-align: center;">暂无数据</p>';
                return;
            }
            const totalScore = wines.reduce((sum, w) => sum + (w.aroma || 0) + (w.taste || 0), 0);
            document.getElementById('avgScore').textContent = (totalScore / (wines.length * 2)).toFixed(1);
            
            // 产区统计
            const regions = {};
            wines.forEach(w => { if (w.region) regions[w.region] = (regions[w.region] || 0) + 1; });
            const maxRegion = Math.max(...Object.values(regions), 1);
            document.getElementById('regionChart').innerHTML = Object.entries(regions)
                .sort((a, b) => b[1] - a[1])
                .slice(0, 5)
                .map(([name, count]) => `
                    <div class="bar-item">
                        <div class="bar-label">${name}</div>
                        <div class="bar-track"><div class="bar-fill" style="width: ${(count / maxRegion * 100).toFixed(0)}%"></div></div>
                        <div class="bar-value">${count}</div>
                    </div>
                `).join('');
            
            // 葡萄品种统计
            const grapes = {};
            wines.forEach(w => { if (w.grape) grapes[w.grape] = (grapes[w.grape] || 0) + 1; });
            const maxGrape = Math.max(...Object.values(grapes), 1);
            document.getElementById('grapeChart').innerHTML = Object.entries(grapes)
                .sort((a, b) => b[1] - a[1])
                .slice(0, 5)
                .map(([name, count]) => `
                    <div class="bar-item">
                        <div class="bar-label">${name}</div>
                        <div class="bar-track"><div class="bar-fill" style="width: ${(count / maxGrape * 100).toFixed(0)}%"></div></div>
                        <div class="bar-value">${count}</div>
                    </div>
                `).join('');
        }
        
        // 导出数据
        function exportData() {
            const data = JSON.stringify(wines, null, 2);
            const blob = new Blob([data], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `wine-notes-${new Date().toISOString().split('T')[0]}.json`;
            a.click();
            URL.revokeObjectURL(url);
            alert('数据已导出！');
        }
        
        // 检查登录状态
        const savedUser = localStorage.getItem('currentUser');
        if (savedUser) {
            currentUser = JSON.parse(savedUser);
            loginSuccess();
        }
    </script>
</body>
</html>
